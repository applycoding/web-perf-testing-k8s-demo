apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northline
  labels:
    app: northline
spec:
  ingressClassName: nginx
  rules:
    - host: northline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: northline
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: northline
                port:
                  number: 80
